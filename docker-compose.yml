services:
  metube:
    build: .
    image: ghcr.io/soundmaker-73/metube:latest
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - AUTH_ENABLED=true
      # Default admin account created on first startup (if not already created)
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=admin
